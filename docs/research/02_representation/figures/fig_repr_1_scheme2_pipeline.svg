   <g id="text_1">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172f40" x="31.05" y="30.502174" transform="rotate(-0 31.05 30.502174)">(a) Learn bucket content, then freeze</text>
   </g>
   <g id="text_2">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #172f40" transform="translate(75.652891 90.911573)">Real training</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #172f40" transform="translate(70.702891 108.477198)">active buckets</text>
   </g>
   <g id="text_3">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #172f40" transform="translate(228.816094 84.290792)">Numeric branch: 82 to 32D</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #172f40" transform="translate(215.354766 99.628175)">Protocol / L7 / service: 16D each</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #172f40" transform="translate(244.278164 114.773605)">Combined input: 80D</text>
   </g>
   <g id="text_4">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #172f40" transform="translate(445.830703 83.727198)">Bucket autoencoder</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #172f40" transform="translate(454.399531 100.130089)">80 to 128 to 64D</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #172f40" transform="translate(450.497109 116.727198)">Unit bucket vector</text>
   </g>
   <g id="text_5">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #172f40" transform="translate(654.378828 91.977198)">Freeze encoder</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #172f40" transform="translate(643.061719 107.411573)">Apply to every split</text>
   </g>
   <g id="text_6">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #596a76" x="413.28" y="160.665652" transform="rotate(-0 413.28 160.665652)">Training buckets fit preprocessing and encoder weights; real validation selects the encoder checkpoint.</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172f40" x="31.05" y="201.341739" transform="rotate(-0 31.05 201.341739)">(b) Compose training examples in frozen embedding space</text>
   </g>
   <g id="text_8">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #172f40" transform="translate(76.071641 254.139198)">Encoded real</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #172f40" transform="translate(65.482422 269.573573)">training originals</text>
   </g>
   <g id="text_9">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #172f40" transform="translate(245.117344 245.889198)">Different-source donors</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #172f40" transform="translate(245.487734 261.323573)">P benign + attack pairs</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #172f40" transform="translate(243.883281 277.823573)">P benign + benign pairs</text>
   </g>
   <g id="text_10">
    <text style="font-size: 10.3px; font-family: 'DejaVu Sans'; fill: #172f40" transform="translate(462.709578 238.95323)">Add bucket vectors</text>
    <text style="font-size: 10.3px; font-family: 'DejaVu Sans'; fill: #172f40" transform="translate(456.284953 254.40323)">L2-normalize the sum</text>
    <text style="font-size: 10.3px; font-family: 'DejaVu Sans'; fill: #172f40" transform="translate(483.504313 269.85323)">Add counts</text>
    <text style="font-size: 10.3px; font-family: 'DejaVu Sans'; fill: #172f40" transform="translate(458.434273 285.30323)">OR masks and labels</text>
   </g>
   <g id="text_11">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #172f40" transform="translate(672.425859 285.228486)">Training pool</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #172f40" transform="translate(663.465156 301.728486)">All real originals</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #172f40" transform="translate(658.734297 319.203018)">+ P B+A + P B+B</text>
   </g>
   <g id="text_12">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #236b8e" x="346.32" y="322.285304" transform="rotate(-0 346.32 322.285304)">Retain every original training sequence</text>
   </g>
   <g id="text_13">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #596a76" x="368.64" y="354.283826" transform="rotate(-0 368.64 354.283826)">P = 8,093 per synthetic class; donors may be reused; zero relative shift</text>
   </g>
   <g id="text_14">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172f40" x="31.05" y="395.502261" transform="rotate(-0 31.05 395.502261)">(c) Preserve real validation and test populations</text>
   </g>
   <g id="text_15">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #172f40" transform="translate(69.315 439.732237)">Real validation / test</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #172f40" transform="translate(82.208203 455.598878)">original buckets</text>
   </g>
   <g id="text_16">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #172f40" transform="translate(288.180938 439.098878)">Apply frozen preprocessing</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #172f40" transform="translate(308.289453 456.664503)">and bucket encoder</text>
   </g>
   <g id="text_17">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #172f40" transform="translate(592.677188 439.098878)">Real sequences only</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #172f40" transform="translate(541.44125 455.598878)">No synthetic validation / test examples</text>
   </g>
   <g id="text_18">
    <text style="font-size: 10.3px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #172f40" x="413.28" y="499.633043" transform="rotate(-0 413.28 499.633043)">Shared detector input: 10 buckets, each with 64 embedding coordinates + 1 standardized log-count channel; separate activity mask</text>
   </g>
  </g>
